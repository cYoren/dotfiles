# Hyprland config — gustvmar

##############
### DEBUG  ###
##############
debug {
    disable_logs = false
}

################
### MONITORS ###
################
monitor=,preferred,auto,1
monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1

####################
### ENVIRONMENT  ###
####################
env = PATH,/home/gustvmar/.nix-profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = LIBVA_DRIVER_NAME,radeonsi
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = XDG_DATA_DIRS,/home/gustvmar/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/home/gustvmar/.local/share:/home/gustvmar/.nix-profile/share:/usr/local/share:/usr/share
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,28
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,28

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$menu = /home/gustvmar/.local/bin/hypr-app-menu
$browser = /home/gustvmar/.local/bin/hypr-open-browser
$files = /home/gustvmar/.local/bin/hypr-open-files
$clipboard = /home/gustvmar/.local/bin/hypr-clipboard-menu
$power = /home/gustvmar/.local/bin/hypr-power-menu
$running = /home/gustvmar/.local/bin/hypr-running-apps

###############
### STARTUP ###
###############
exec-once = dbus-update-activation-environment --systemd --all
exec-once = /home/gustvmar/.local/bin/hypr-start-wallpaper
exec-once = /home/gustvmar/.local/bin/hypr-restart-waybar
exec-once = /home/gustvmar/.nix-profile/bin/swaync
exec-once = /usr/bin/nm-applet --indicator
exec-once = sh -lc 'command -v blueman-applet >/dev/null && blueman-applet'
exec-once = sh -lc 'command -v cliphist >/dev/null && wl-paste --type text --watch cliphist store'
exec-once = sh -lc 'command -v cliphist >/dev/null && wl-paste --type image --watch cliphist store'
# hypridle/hyprlock disabled: nixpkgs hyprlock crashes on this system
# (EGL_EXT_platform_base not supported) — do not re-enable until fixed.

#################
### VARIABLES ###
#################
$mainMod = SUPER

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = false
        range = 15
        render_power = 3
        color = rgba(1e1e2eee)
    }

    blur {
        enabled = false
        size = 6
        passes = 3
        new_optimizations = true
    }
}

animations {
    enabled = false
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = br
    kb_variant = abnt2
    repeat_rate = 30
    repeat_delay = 500
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# Touchpad workspace swipe
gesture = 3, horizontal, workspace
gesture = 4, pinch, workspace

###################
### WINDOW RULES ###
###################
windowrule = float class:^(pavucontrol)$
windowrule = float class:^(blueman-manager)$
windowrule = float class:^(nm-connection-editor)$
windowrule = float title:^(Picture-in-Picture)$
windowrule = pin title:^(Picture-in-Picture)$
windowrule = float class:^(xdg-desktop-portal-gtk)$

################
### KEYBINDS ###
################
# Basics
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, $power
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, $clipboard
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $files
bind = $mainMod, Tab, exec, $running
bind = $mainMod, Space, exec, $menu
bind = $mainMod, slash, exec, /home/gustvmar/.local/bin/hypr-cheatsheet-menu
bind = $mainMod, Escape, exec, $power
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, minus, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, minus, togglespecialworkspace, minimized
bind = $mainMod, backspace, exec, /home/gustvmar/.local/bin/hypr-restore-minimized
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, B, exec, /home/gustvmar/.local/bin/hypr-restart-waybar
bind = $mainMod SHIFT, E, exec, kitty -e yazi
bind = $mainMod SHIFT, Q, exec, $power

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Nudge floating windows after detaching them with SUPER+V
binde = $mainMod CTRL, left, moveactive, -60 0
binde = $mainMod CTRL, right, moveactive, 60 0
binde = $mainMod CTRL, up, moveactive, 0 -60
binde = $mainMod CTRL, down, moveactive, 0 60
bind = $mainMod SHIFT, V, centerwindow

# Resize
binde = $mainMod ALT, right, resizeactive, 50 0
binde = $mainMod ALT, left, resizeactive, -50 0
binde = $mainMod ALT, up, resizeactive, 0 -50
binde = $mainMod ALT, down, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen
bind = $mainMod SHIFT, S, exec, grimblast copy area
bind = $mainMod ALT, S, exec, sh -lc 'grimblast --freeze save area - | swappy -f -'

# Resize submap (repeatable arrow-key resize without holding modifiers)
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 30 0
binde = , left, resizeactive, -30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
