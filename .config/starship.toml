# Starship config — clean, informative, fast

format = """
[╭─](bold green)$os$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$docker_context
[╰─](bold green)$character"""

[os]
disabled = false
style = "bold blue"

[os.symbols]
Ubuntu = " "
Pop = " "
Linux = " "

[username]
show_always = false
style_user = "bold yellow"
format = "[$user]($style) "

[hostname]
ssh_only = true
format = "[@$hostname](bold red) "

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
format = "[ $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "Pipfile"]

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold orange"

[golang]
symbol = " "
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue bold"
only_with_files = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
